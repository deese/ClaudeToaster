name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o ../dist/claudetoaster.exe .

      - name: Checksum
        working-directory: dist
        run: sha256sum claudetoaster.exe > claudetoaster.exe.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ../dist/claudetoaster.exe ../dist/claudetoaster.exe.sha256 --generate-notes
