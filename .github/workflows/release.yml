name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o ../dist/claudetoaster.exe .

      - name: Package
        run: 7z a -tzip ../dist/claudetoaster-${{ github.ref_name }}-windows-amd64.zip ../dist/claudetoaster.exe ../LICENSE ../README.md

      - name: Checksum
        working-directory: dist
        run: sha256sum claudetoaster.exe claudetoaster-*.zip > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ../dist/claudetoaster.exe ../dist/claudetoaster-*.zip ../dist/SHA256SUMS --generate-notes
